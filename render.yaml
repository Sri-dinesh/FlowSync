services:
  - type: web
    name: flowsync-server
    runtime: python
    buildCommand: >-
      pip install --upgrade pip &&
      pip install --no-cache-dir -r server/requirements.txt
    startCommand: bash -c "cd server && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.15
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
