name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - run: python scripts/check_repository.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flowsync
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/flowsync
      NEXT_PUBLIC_FASTAPI_HTTP_URL: http://localhost:8000
      NEXT_PUBLIC_FASTAPI_WS_URL: ws://localhost:8000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: public-placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      MPLCONFIGDIR: /tmp/flowsync-matplotlib
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt
            research/requirements.txt
      - run: python -m pip install -r research/requirements.txt -r server/requirements-dev.txt
      - run: python -m pytest server/tests --no-cov -p no:cacheprovider -q
